[tool.poetry]
name = "pipelines"
version = "0.1.0"
authors = ["Example User <user@example.com>"]
description = "Vertex AI Pipelines end-to-end sample"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
]
packages = [
    { include = "pipelines", from = "src" },
]

[tool.poetry.dependencies]
python = ">=3.12,<4.0"
Jinja2 = ">=3.0.1,<4.0.0"
google-cloud-aiplatform = ">=1.135.0"
google-cloud-storage = ">=3.8.0"
google-cloud-pipeline-components = "^2.22.0"
components = { path = "../components", develop = true }
shared = {path = "../config", develop = true}
kfp = "^2.15.2"
pyyaml = "6.0.1"
cmake = ">=3.24"
xgboost-cpu = "^3.1.3"

[tool.poetry.group.dev.dependencies]
pytest = ">=7.3.1,<=9.0.2"
pre-commit = ">=2.14.1,<=4.5.1"
coverage = "==7.13.2"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.flake8]
max-line-length = 88
per-file-ignores = [
    "E203",
    "F841"
]
ignore = [
    "E203",
    "F841",
]

[tool.pytest.ini_options]
pythonpath = [
  "src"
]
testpaths = "tests"
junit_family = "xunit2"
