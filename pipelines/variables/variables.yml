---
vertex_project_dev: "my-gcp-project-dev"
vertex_project_staging: "my-gcp-project-staging"
vertex_project_prod: "my-gcp-project-prod"
resource_suffix: "default"

dev:
  
  prediction_type: "endpoint"  # "batch" for batch prediction, "endpoint" for deploy+smoke-test
  undeploy_endpoint: false  # if false, leave the model deployed after smoke-test (endpoint mode only)
  endpoint_name: "turbo-prediction-endpoint"
  model_name: "xgb_regressor"
  vertex_location: "europe-west2"
  bq_location: "europe-west2"
  bq_dataset_id: "chicago_taxi_trips"
  bq_table_id: "taxi_trips"

  training:
    label: "total_fare"
    n_estimators: 200
    early_stopping_rounds: 10
    objective: "reg:squarederror"
    booster: "gbtree"
    learning_rate: 0.3
    min_split_loss: 0
    max_depth: 6
    train_test_split_size: 0.2
    train_valid_split_size: 0.25
    train_test_random_state: 1
    train_valid_random_state: 1

  scheduler:
    enable_training_scheduler: false
    training_cron: "0 0 * * 4"  # https://crontab.guru/
    training_max_concurrent_run_count: 1
    training_max_run_count: 0  # Put 0 for infinite

    enable_prediction_scheduler: false
    prediction_cron: ""  # https://crontab.guru/
    prediction_max_concurrent_run_count: 1
    prediction_max_run_count: 0  # Put 0 for infinite
  alert_emails:
    - "example@example.com"
  notification_channels: []
  # enable + drift/logging apply to endpoint Model Monitoring v2 only.
  # skew_thresholds are used by batch Model Monitoring v1.
  monitoring:
    enable: true
    logging_sampling_rate: 0.3
    default_drift_threshold: 0.3
    skew_thresholds:
      defaultSkewThreshold:
        value: 0.001
    monitored_features:
      dayofweek: "float"
      hourofday: "float"
      trip_distance: "float"
      trip_miles: "float"
      trip_seconds: "float"
      payment_type: "categorical"
      company: "categorical"
    notification_emails:
      - "example@example.com"

